<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — XingQing Machinery</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <style>
    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
    .container-404 { max-width: 500px; padding: 40px; }
    h1 { font-size: 80px; font-weight: 800; color: var(--accent); margin: 0; line-height: 1; }
    p { color: var(--text-secondary); margin: 20px 0 32px; line-height: 1.7; }
    a { display: inline-block; background: var(--accent); color: var(--bg-primary); padding: 12px 32px; border-radius: 6px; font-weight: 700; text-decoration: none; transition: background var(--transition); }
    a:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="container-404">
    <h1>404</h1>
    <p>Sorry, the page you're looking for does not exist.<br>Please check the URL or go back to the homepage to browse other content.</p>
    <a href="./">Back to Home</a>
  </div>
</body>
</html>
